<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مولد أوراق العمل | رياضيات</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#111827;
      --muted:#6b7280;
      --dash:#9ca3af;

      --accent:#7c5cff;
      --accent2:#ef7aa8;
      --good:#16a34a;
      --bad:#dc2626;

      --card: rgba(255,255,255,.90);
      --border: rgba(17,24,39,.12);
      --shadow: 0 10px 30px rgba(17,24,39,.10);
      --radius: 18px;

      /* print-friendly sizing */
      --pagePad: 18px;
      --pageBorder: 4px;
      --innerInset: 9px;

      --titleSize: 26px;
      --infoSize: 13.8px;
      --secSize: 15px;
      --secNum: 18px;
      --eqSize: 13.5px;

      --blankW: 120px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:'Tajawal', system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(239,122,168,.16) 0%, rgba(255,255,255,0) 60%),
        radial-gradient(1000px 700px at 80% 20%, rgba(124,92,255,.14) 0%, rgba(255,255,255,0) 62%),
        #ffffff;
      min-height:100vh;
    }
    .wrap{ max-width:1180px; margin:auto; padding:16px; }

    /* ===== App Bar ===== */
    .appBar{
      background: var(--card);
      border: 1px solid rgba(124,92,255,.18);
      border-radius: var(--radius);
      padding: 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 280px;
    }
    .logoWrap{
      width:52px;
      height:52px;
      border-radius:16px;
      border: 1px solid rgba(124,92,255,.22);
      background: linear-gradient(135deg, rgba(124,92,255,.12), rgba(239,122,168,.10));
      display:grid;
      place-items:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .logoWrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .brandTitle{
      font-weight:1000;
      font-size:18px;
      line-height:1.2;
    }
    .brandSub{
      font-weight:800;
      font-size:12.5px;
      color: var(--muted);
      margin-top:2px;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
    }
    .tabBtn{
      border:none;
      cursor:pointer;
      padding:9px 12px;
      border-radius: 999px;
      background:#fff;
      border:1px solid rgba(17,24,39,.12);
      font-weight:1000;
      transition:.12s ease;
      display:inline-flex;
      gap:8px;
      align-items:center;
      white-space:nowrap;
    }
    .tabBtn.active{
      background: linear-gradient(135deg, rgba(124,92,255,.18), rgba(239,122,168,.16));
      border-color: rgba(124,92,255,.25);
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .btn{
      border:none;
      cursor:pointer;
      padding:10px 12px;
      border-radius: 14px;
      background:#fff;
      border:1px solid rgba(17,24,39,.12);
      box-shadow: 0 6px 18px rgba(17,24,39,.08);
      font-weight:1000;
      transition: transform .12s ease, box-shadow .12s ease;
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 22px rgba(17,24,39,.10); }
    .btn.primary{
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(239,122,168,.90));
      color:#fff;
      border-color: transparent;
      box-shadow: 0 10px 22px rgba(124,92,255,.18);
    }
    .btn.ghost{
      background: transparent;
      border-color: rgba(124,92,255,.22);
      box-shadow:none;
    }
    .btn.danger{
      background: rgba(220,38,38,.08);
      border-color: rgba(220,38,38,.22);
      box-shadow:none;
    }

    /* ===== Panels ===== */
    .panel{
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 10px 30px rgba(17,24,39,.08);
    }
    .panelTitle{
      font-weight:1000;
      font-size:15px;
      margin-bottom:10px;
      color: rgba(17,24,39,.92);
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
    }
    .col{ flex: 1 1 260px; min-width: 260px; }
    .col.small{ flex: 1 1 180px; min-width: 180px; }
    .col.tiny{ flex: 0 0 170px; min-width:170px; }

    label{
      display:block;
      font-weight:1000;
      font-size:12.5px;
      color: rgba(17,24,39,.85);
      margin:0 0 6px;
    }
    input[type="text"], select, textarea{
      width:100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.14);
      background:#fff;
      font-weight:900;
      outline:none;
    }
    textarea{
      min-height: 70px;
      resize: vertical;
      font-weight:800;
      line-height:1.6;
    }
    .check{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.10);
      background:#fff;
    }
    .check input{ width:18px; height:18px; cursor:pointer; }

    .hr{
      height:1px;
      background: rgba(17,24,39,.10);
      margin: 12px 0;
    }

    /* ===== Question list ===== */
    .qList{ display:flex; flex-direction:column; gap:8px; }
    .qItem{
      background:#fff;
      border:1px solid rgba(17,24,39,.10);
      border-radius: 16px;
      padding:10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .qMeta{
      font-weight:900;
      color: rgba(17,24,39,.86);
      line-height:1.5;
      max-width: 720px;
    }
    .qActions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius: 999px;
      background: rgba(124,92,255,.10);
      border: 1px solid rgba(124,92,255,.16);
      font-weight:1000;
      font-size:12px;
    }
    .thumbs{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .thumb{
      width: 84px;
      height: 56px;
      border-radius: 12px;
      border: 1px solid rgba(17,24,39,.12);
      object-fit: cover;
      background:#fff;
    }

    /* ===== Worksheet Page ===== */
    .page{
      margin-top: 14px;
      background:#fff;
      border: var(--pageBorder) dashed var(--dash);
      border-radius: 22px;
      padding: var(--pagePad);
      position:relative;
    }
    .page::before{
      content:"";
      position:absolute;
      inset: var(--innerInset);
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      pointer-events:none;
    }

    .sheetTitle{
      text-align:center;
      font-weight:1000;
      font-size: var(--titleSize);
      margin: 2px 0 10px;
      position:relative;
      z-index:1;
    }
    .infoBar{
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 8px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin: 0 4px 10px;
      position:relative;
      z-index:1;
    }
    .infoItem{
      font-weight:1000;
      font-size: var(--infoSize);
      display:flex;
      align-items:center;
      gap:10px;
      color: rgba(17,24,39,.90);
    }
    .dots{
      display:inline-block;
      width: 300px;
      max-width: 52vw;
      border-bottom: 3px dotted rgba(17,24,39,.35);
      transform: translateY(-2px);
      height: 15px;
    }
    .dots.small{ width: 180px; max-width: 40vw; }

    .sec{
      margin: 8px 6px 0;
      position:relative;
      z-index:1;
    }
    .secHead{
      display:flex;
      align-items:flex-start;
      gap:10px;
      margin: 6px 0 6px;
    }
    .secNum{
      font-weight:1000;
      font-size: var(--secNum);
      line-height: 1;
      margin-top: 2px;
      min-width: 24px;
      text-align:center;
      color: rgba(17,24,39,.88);
    }
    .secText{
      font-weight:1000;
      font-size: var(--secSize);
      color: rgba(17,24,39,.88);
      line-height:1.6;
    }

    .sec1Grid, .sec2Grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      align-items:start;
    }
    @media (max-width: 880px){
      .sec1Grid, .sec2Grid{ grid-template-columns: 1fr; }
      .col{ min-width: 220px; }
    }

    .cardQ{
      border: 1px solid rgba(17,24,39,.10);
      background: #fff;
      border-radius: 16px;
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      break-inside: avoid;
      position:relative;
      overflow:hidden;
    }
    .cardQ::before{
      content:"";
      position:absolute;
      inset:-60px -80px auto auto;
      width:160px; height:160px;
      border-radius:999px;
      background: radial-gradient(circle at 40% 40%, rgba(124,92,255,.10), rgba(239,122,168,.08), rgba(255,255,255,0) 65%);
      transform: rotate(20deg);
      pointer-events:none;
    }

    .qPrompt{
      font-weight:1000;
      font-size: 13.6px;
      line-height: 1.7;
      color: rgba(17,24,39,.92);
      position:relative;
      z-index:1;
      white-space: pre-wrap;
    }

    .eqRow{
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap: 10px;
      font-weight:1000;
      font-size: var(--eqSize);
      color: rgba(17,24,39,.88);
      position:relative;
      z-index:1;
      flex-wrap:wrap;
    }
    .expr{
      min-width: 160px;
      display:flex;
      flex-direction:row;
      direction:ltr; /* تثبيت ترتيب العرض */
      justify-content:flex-end;
      align-items:center;
      gap:6px;
      text-align:right;
    }
    .expr .num{ font-weight:1000; letter-spacing:.2px; }
    .expr .op{ font-weight:1000; padding:0 2px; }

    .blank{
      display:inline-flex;
      align-items:flex-end;
      gap: 8px;
    }
    .ans{
      width: var(--blankW);
      padding: 7px 8px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.18);
      font-weight:1000;
      text-align:center;
      outline:none;
      background:#fff;
      transition: box-shadow .12s ease, border-color .12s ease;
      font-size: 13.5px;
    }
    .ans.correct{ border-color: rgba(22,163,74,.55); box-shadow: 0 0 0 4px rgba(22,163,74,.12); }
    .ans.wrong{ border-color: rgba(220,38,38,.55); box-shadow: 0 0 0 4px rgba(220,38,38,.10); }

    .printLine{
      display:none;
      width: calc(var(--blankW) + 18px);
      border-bottom: 3px dotted rgba(17,24,39,.35);
      transform: translateY(-2px);
      height: 15px;
    }

    /* ==== True/False ==== */
    .tfRow{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
      position:relative;
      z-index:1;
    }
    .tfOpt{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border: 1px solid rgba(17,24,39,.12);
      background: rgba(255,255,255,.92);
      padding:8px 10px;
      border-radius:999px;
      cursor:pointer;
      font-weight:1000;
      user-select:none;
    }
    .tfCircle{
      width:16px; height:16px;
      border-radius:999px;
      border:2px solid rgba(17,24,39,.45);
      position:relative;
      flex:0 0 auto;
    }
    .tfCircle.fill::after{
      content:"";
      position:absolute;
      inset:3px;
      border-radius:999px;
      background: rgba(124,92,255,.85);
    }
    .tfHidden{ display:none; }

    /* ==== Matching ==== */
    .matchWrap{
      border: 1px dashed rgba(124,92,255,.28);
      background: rgba(124,92,255,.05);
      border-radius: 14px;
      padding: 10px;
      position:relative;
      z-index:1;
    }
    .matchGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      align-items:start;
    }
    @media (max-width: 650px){
      .matchGrid{ grid-template-columns: 1fr; }
    }
    .matchColTitle{
      font-weight:1000;
      margin-bottom:8px;
      color: rgba(17,24,39,.80);
    }
    .matchItem{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.10);
      background:#fff;
      margin-bottom:8px;
      font-weight:1000;
    }
    .matchLabel{
      display:inline-flex;
      gap:8px;
      align-items:center;
      white-space:nowrap;
    }
    .matchSel{
      padding:8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(17,24,39,.14);
      font-weight:1000;
      background:#fff;
      min-width: 120px;
    }
    .matchLine{
      display:none;
      width: 140px;
      border-bottom: 2px dotted rgba(17,24,39,.35);
      height: 14px;
      transform: translateY(-2px);
    }

    /* ===== Footer in app only ===== */
    .appFooter{
      margin-top: 10px;
      text-align:center;
      font-weight:1000;
      color: rgba(17,24,39,.70);
      font-size: 12.6px;
    }

    /* Print */
    @page{ size: A4; margin: 10mm; }
    @media print{
      body{ background:#fff; }
      .wrap{ max-width: unset; padding:0; }
      .noPrint{ display:none !important; }
      .appFooter{ display:none !important; }

      .ans{ display:none !important; }
      .printLine{ display:inline-block !important; }

      .matchSel{ display:none !important; }
      .matchLine{ display:inline-block !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="appBar noPrint">
      <div class="brand">
        <div class="logoWrap">
          <img id="appLogo" alt="شعار الملتقى">
        </div>
        <div>
          <div class="brandTitle">مولد أوراق العمل (رياضيات)</div>
          <div class="brandSub">ملتقى التعليم التفاعلي</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tabBtn active" id="tabAuto" type="button">⚡ توليد تلقائي</button>
        <button class="tabBtn" id="tabCustom" type="button">🧾 توليد ذاتي</button>
      </div>

      <div class="actions">
        <button class="btn" id="btnCheck" type="button">✅ تحقّق</button>
        <button class="btn ghost" id="btnClear" type="button">🧹 مسح</button>
        <button class="btn" id="btnPrint" type="button">🖨️ طباعة</button>
      </div>
    </div>

    <!-- AUTO -->
    <div class="panel noPrint" id="autoPanel">
      <div class="panelTitle">التوليد التلقائي</div>
      <div class="row">
        <div class="col">
          <label for="autoTitle">عنوان الدرس</label>
          <input id="autoTitle" type="text" value="القسمة على ٥" />
        </div>

        <div class="col small">
          <label for="autoTopic">نوع الدرس</label>
          <select id="autoTopic">
            <option value="auto" selected>تلقائي حسب العنوان</option>
            <option value="add">جمع</option>
            <option value="sub">طرح</option>
            <option value="mul">ضرب</option>
            <option value="div">قسمة</option>
            <option value="fractions">كسور</option>
            <option value="shape2d">أشكال ٢D</option>
            <option value="solids">مجسمات</option>
            <option value="equations">معادلات</option>
            <option value="functions">جداول دوال</option>
          </select>
        </div>

        <div class="col small">
          <label for="autoLevel">الصعوبة</label>
          <select id="autoLevel">
            <option value="easy" selected>سهل</option>
            <option value="mid">متوسط</option>
            <option value="hard">متقدم</option>
          </select>
        </div>

        <div class="col small">
          <label class="check" style="margin-top:22px;">
            <input type="checkbox" id="autoVisuals" checked>
            رسوم توضيحية
          </label>
        </div>

        <div class="col tiny">
          <button class="btn primary" id="btnAutoGenerate" type="button">✨ توليد</button>
        </div>
      </div>
    </div>

    <!-- CUSTOM -->
    <div class="panel noPrint" id="customPanel" style="display:none;">
      <div class="panelTitle">التوليد الذاتي</div>

      <div class="row">
        <div class="col">
          <label for="customTitle">عنوان ورقة العمل</label>
          <input id="customTitle" type="text" value="ورقة عمل رياضيات" />
        </div>
        <div class="col small">
          <label for="customGrade">الصف</label>
          <select id="customGrade">
            <option selected>ثالث</option>
            <option>رابع</option>
            <option>خامس</option>
            <option>سادس</option>
            <option>عام</option>
          </select>
        </div>
        <div class="col">
          <label for="customSec1Text">عنوان القسم (١)</label>
          <input id="customSec1Text" type="text" value="القسم (١):" />
        </div>
        <div class="col">
          <label for="customSec2Text">عنوان القسم (٢)</label>
          <input id="customSec2Text" type="text" value="القسم (٢):" />
        </div>
      </div>

      <div class="hr"></div>

      <div class="row">
        <div class="col small">
          <label for="qSection">القسم</label>
          <select id="qSection">
            <option value="1">القسم (١)</option>
            <option value="2" selected>القسم (٢)</option>
          </select>
        </div>

        <div class="col">
          <label for="qType">نوع السؤال</label>
          <select id="qType">
            <option value="prompt" selected>سؤال حر</option>
            <option value="expr">تعبير حسابي</option>
            <option value="fill">أكمل الفراغ</option>
            <option value="tf">صح / خطأ</option>
            <option value="match">وصل (أ) بـ (ب)</option>
            <option value="mcq">اختيار من متعدد</option>
          </select>
        </div>
      </div>

      <div id="typeFields" style="margin-top:10px;"></div>

      <div class="row" style="margin-top:10px;">
        <div class="col">
          <label>صور للسؤال (حتى صورتين)</label>
          <input id="qImages" type="file" accept="image/*" multiple />
          <div class="thumbs" id="imgPreview"></div>
          <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn ghost" id="btnClearImages" type="button">🧹 مسح الصور</button>
          </div>
        </div>
      </div>

      <div class="hr"></div>

      <div class="row">
        <button class="btn primary" id="btnSaveQuestion" type="button">➕ إضافة السؤال</button>
        <button class="btn ghost" id="btnCancelEdit" type="button" style="display:none;">إلغاء</button>
        <button class="btn" id="btnExport" type="button">⬇️ تصدير</button>
        <label class="btn" style="display:inline-flex; gap:8px; align-items:center; cursor:pointer;">
          ⬆️ استيراد
          <input id="importFile" type="file" accept="application/json" hidden />
        </label>
      </div>

      <div class="hr"></div>
      <div class="panelTitle">قائمة الأسئلة</div>
      <div class="qList" id="questionList"></div>
    </div>

    <!-- WORKSHEET -->
    <section class="page" id="page">
      <div class="sheetTitle" id="sheetTitle">—</div>

      <div class="infoBar">
        <div class="infoItem">الاسم: <span class="dots"></span></div>
        <div class="infoItem">الفصل: <span class="dots small"></span></div>
      </div>

      <div class="sec" id="sec1Wrap">
        <div class="secHead">
          <div class="secNum">١</div>
          <div class="secText" id="sec1Text">—</div>
        </div>
        <div class="sec1Grid" id="sec1Grid"></div>
      </div>

      <div class="sec" style="margin-top:10px;" id="sec2Wrap">
        <div class="secHead">
          <div class="secNum">٢</div>
          <div class="secText" id="sec2Text">—</div>
        </div>
        <div class="sec2Grid" id="sec2Grid"></div>
      </div>

      <div class="bottomBar">
        <div id="gradeLine">الصف: ثالث</div>
        <div></div>
      </div>
    </section>

    <div class="appFooter noPrint">
      أ/ فاطمة هزازي، | ملتقى معلمي ومعلمات الرياضيات | الملتقى التفاعلي
    </div>
  </div>

  <script>
    /* --------- Logo loader (GitHub Pages case-sensitive) --------- */
    (function loadLogo(){
      const img = document.getElementById('appLogo');
      const candidates = ["Logo.jpg","logo.jpg","Logo.png","logo.png","Logo.jpeg","logo.jpeg","Logo.webp","logo.webp"];
      let idx = 0;

      function tryNext(){
        if(idx >= candidates.length){
          img.alt = "الشعار غير متاح";
          return;
        }
        const src = candidates[idx++];
        const test = new Image();
        test.onload = ()=> { img.src = src; };
        test.onerror = tryNext;
        test.src = src + "?v=" + Date.now();
      }
      tryNext();
    })();

    /* --------- Arabic digits helpers --------- */
    const AR_NUMS = "٠١٢٣٤٥٦٧٨٩";
    const FA_NUMS = "۰۱۲۳۴۵۶۷۸۹";
    const toArabicDigits = (input) => String(input ?? "")
      .replace(/\d/g, d => AR_NUMS[d])
      .replace(/[۰-۹]/g, d => AR_NUMS[FA_NUMS.indexOf(d)]);
    const toWesternDigits = (input) => String(input ?? "")
      .replace(/[٠-٩]/g, d => String(AR_NUMS.indexOf(d)))
      .replace(/[۰-۹]/g, d => String(FA_NUMS.indexOf(d)));
    const parseNum = (v) => {
      const s = toWesternDigits(String(v ?? "")).replace(/[^\d-]/g,'');
      if(!s) return NaN;
      return parseInt(s, 10);
    };

    const $ = (s, el=document)=> el.querySelector(s);
    const $$ = (s, el=document)=> Array.from(el.querySelectorAll(s));
    const uid = ()=> "q_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
    const clamp = (n,a,b)=> Math.max(a, Math.min(b,n));

    /* --------- State --------- */
    const state = {
      mode: "auto",
      custom: {
        title: "ورقة عمل رياضيات",
        grade: "ثالث",
        sec1Text: "القسم (١):",
        sec2Text: "القسم (٢):",
        questions: []
      },
      editId: null,
      pendingImages: []
    };

    function saveLocal(){
      try{ localStorage.setItem("mw_custom_types_v1", JSON.stringify(state.custom)); }catch(e){}
    }
    function loadLocal(){
      try{
        const s = localStorage.getItem("mw_custom_types_v1");
        if(!s) return;
        const obj = JSON.parse(s);
        if(obj && Array.isArray(obj.questions)){
          state.custom = obj;
        }
      }catch(e){}
    }

    /* --------- Rendering helpers --------- */
    function makeAnswerInput(correct=""){
      const span = document.createElement('span');
      span.className = 'blank';

      const inp = document.createElement('input');
      inp.className = 'ans noPrint';
      inp.type = 'text';
      inp.inputMode = 'numeric';
      inp.dataset.correct = (correct ?? "").toString();
      inp.addEventListener('input', ()=>{
        const raw = toWesternDigits(inp.value).replace(/[^\d-]/g,'');
        inp.value = toArabicDigits(raw);
      });

      const line = document.createElement('span');
      line.className = 'printLine printOnly';

      span.appendChild(inp);
      span.appendChild(line);
      return span;
    }

    function renderImages(images){
      if(!images || !images.length) return null;
      const box = document.createElement('div');
      box.className = 'mediaBox';
      const row = document.createElement('div');
      row.className = 'imgRow';
      images.slice(0,2).forEach(src=>{
        const img = document.createElement('img');
        img.className = 'qImg';
        img.src = src;
        img.alt = 'صورة';
        row.appendChild(img);
      });
      box.appendChild(row);
      return box;
    }

    function renderExpr(left, op, right, correct=""){
      const row = document.createElement('div');
      row.className = 'eqRow';

      const expr = document.createElement('div');
      expr.className = 'expr';

      const leftSpan = document.createElement('span'); leftSpan.className='num'; leftSpan.textContent = toArabicDigits(left);
      const opSpan = document.createElement('span'); opSpan.className='op'; opSpan.textContent = op;
      const rightSpan = document.createElement('span'); rightSpan.className='num'; rightSpan.textContent = toArabicDigits(right);

      expr.appendChild(leftSpan);
      expr.appendChild(opSpan);
      expr.appendChild(rightSpan);

      const eq = document.createElement('div'); eq.textContent = "=";
      const blank = makeAnswerInput(correct);

      row.appendChild(expr);
      row.appendChild(eq);
      row.appendChild(blank);
      return row;
    }

    function renderFill(text, correct=""){
      const row = document.createElement('div');
      row.className = 'qPrompt';

      const token = "____";
      const idx = text.indexOf(token);
      const before = idx>=0 ? text.slice(0,idx) : text;
      const after  = idx>=0 ? text.slice(idx+token.length) : "";

      const wrap = document.createElement('div');
      wrap.className = 'eqRow';
      wrap.style.alignItems = "baseline";

      const b = document.createElement('span'); b.textContent = toArabicDigits(before);
      const blank = makeAnswerInput(correct);
      const a = document.createElement('span'); a.textContent = toArabicDigits(after);

      wrap.appendChild(b);
      wrap.appendChild(blank);
      wrap.appendChild(a);

      return wrap;
    }

    function renderTrueFalse(statement, correct=null){
      const card = document.createElement('div');

      const p = document.createElement('div');
      p.className = 'qPrompt';
      p.textContent = toArabicDigits(statement);
      card.appendChild(p);

      const row = document.createElement('div');
      row.className = 'tfRow';

      const name = "tf_" + uid();
      const mk = (label, val)=> {
        const opt = document.createElement('div');
        opt.className = 'tfOpt';

        const circle = document.createElement('span');
        circle.className = 'tfCircle';

        const txt = document.createElement('span');
        txt.textContent = label;

        const hidden = document.createElement('input');
        hidden.type="radio";
        hidden.name=name;
        hidden.value=val;
        hidden.className="tfHidden";
        hidden.dataset.correct = (correct===null || correct===undefined) ? "" : (correct ? "true":"false");

        opt.addEventListener('click', ()=>{
          $$(`input[name="${name}"]`).forEach(r=> r.checked=false);
          hidden.checked=true;
          $$('.tfCircle', row).forEach(c=> c.classList.remove('fill'));
          circle.classList.add('fill');
        });

        opt.appendChild(circle);
        opt.appendChild(txt);
        opt.appendChild(hidden);
        return opt;
      };

      row.appendChild(mk("صح","true"));
      row.appendChild(mk("خطأ","false"));
      card.appendChild(row);

      return card;
    }

    function renderMatch(colA, colB, keyArr=null){
      const wrap = document.createElement('div');
      wrap.className = 'matchWrap';

      const grid = document.createElement('div');
      grid.className = 'matchGrid';

      const colABox = document.createElement('div');
      const colBBox = document.createElement('div');

      const titleA = document.createElement('div');
      titleA.className = 'matchColTitle';
      titleA.textContent = 'العمود (أ)';

      const titleB = document.createElement('div');
      titleB.className = 'matchColTitle';
      titleB.textContent = 'العمود (ب)';

      colABox.appendChild(titleA);
      colBBox.appendChild(titleB);

      // B column list with numbers
      colB.forEach((txt, i)=>{
        const item = document.createElement('div');
        item.className = 'matchItem';
        item.innerHTML = `<span class="matchLabel">(${toArabicDigits(i+1)})</span><span>${toArabicDigits(txt)}</span>`;
        colBBox.appendChild(item);
      });

      // A items with selector / print line
      colA.forEach((txt, i)=>{
        const item = document.createElement('div');
        item.className = 'matchItem';

        const label = document.createElement('span');
        label.className = 'matchLabel';
        label.textContent = `(${toArabicDigits(i+1)})`;

        const textSpan = document.createElement('span');
        textSpan.textContent = toArabicDigits(txt);

        const sel = document.createElement('select');
        sel.className = 'matchSel noPrint';
        sel.dataset.kind = "match";
        sel.dataset.index = String(i);
        sel.dataset.correct = Array.isArray(keyArr) ? String(keyArr[i] ?? "") : "";
        // options
        const op0 = document.createElement('option');
        op0.value = "";
        op0.textContent = "اختر";
        sel.appendChild(op0);

        for(let k=1;k<=colB.length;k++){
          const op = document.createElement('option');
          op.value = String(k);
          op.textContent = toArabicDigits(k);
          sel.appendChild(op);
        }

        const line = document.createElement('span');
        line.className = 'matchLine printOnly';

        const right = document.createElement('div');
        right.style.display="flex";
        right.style.gap="8px";
        right.style.alignItems="center";
        right.appendChild(label);
        right.appendChild(textSpan);

        item.appendChild(right);
        item.appendChild(sel);
        item.appendChild(line);
        colABox.appendChild(item);
      });

      grid.appendChild(colABox);
      grid.appendChild(colBBox);
      wrap.appendChild(grid);

      return wrap;
    }

    function renderQuestion(q){
      const card = document.createElement('div');
      card.className = 'cardQ';

      if(q.images && q.images.length){
        const img = renderImages(q.images);
        if(img) card.appendChild(img);
      }

      if(q.type === "prompt"){
        const p = document.createElement('div');
        p.className = 'qPrompt';
        p.textContent = toArabicDigits(q.prompt || "");
        card.appendChild(p);

        const row = document.createElement('div');
        row.className = 'eqRow';
        row.appendChild(makeAnswerInput(q.correct ?? ""));
        card.appendChild(row);
      }

      if(q.type === "expr"){
        const p = document.createElement('div');
        p.className = 'qPrompt';
        p.textContent = toArabicDigits(q.prompt || "احسب:");
        card.appendChild(p);

        // ملاحظة: لعرض القسمة بالشكل المطلوب: المقسوم (الكبير) في right، والمقسوم عليه في left
        card.appendChild(renderExpr(q.left, q.op, q.right, q.correct ?? ""));
      }

      if(q.type === "fill"){
        const p = document.createElement('div');
        p.className = 'qPrompt';
        p.textContent = "أكمل:";
        card.appendChild(p);
        card.appendChild(renderFill(q.text || "", q.correct ?? ""));
      }

      if(q.type === "tf"){
        const tf = renderTrueFalse(q.statement || "", (q.correct===true) ? true : (q.correct===false ? false : null));
        card.appendChild(tf);
      }

      if(q.type === "match"){
        const p = document.createElement('div');
        p.className = 'qPrompt';
        p.textContent = "صل من العمود (أ) إلى العمود (ب):";
        card.appendChild(p);
        card.appendChild(renderMatch(q.colA || [], q.colB || [], Array.isArray(q.key) ? q.key : null));
      }

      if(q.type === "mcq"){
        const p = document.createElement('div');
        p.className = 'qPrompt';
        p.textContent = toArabicDigits(q.prompt || "اختر الإجابة الصحيحة:");
        card.appendChild(p);

        const list = document.createElement('div');
        list.className = 'tfRow'; // reuse layout

        const name = "mcq_" + q.id;
        (q.options || []).forEach((opt, idx)=>{
          const optEl = document.createElement('div');
          optEl.className = 'tfOpt';

          const circle = document.createElement('span');
          circle.className = 'tfCircle';

          const txt = document.createElement('span');
          txt.textContent = toArabicDigits(opt);

          const hidden = document.createElement('input');
          hidden.type="radio";
          hidden.name=name;
          hidden.value=String(idx);
          hidden.className="tfHidden";
          hidden.dataset.correct = (q.correctIndex===0 || q.correctIndex) ? String(q.correctIndex) : "";

          optEl.addEventListener('click', ()=>{
            $$(`input[name="${name}"]`).forEach(r=> r.checked=false);
            hidden.checked=true;
            $$('.tfCircle', list).forEach(c=> c.classList.remove('fill'));
            circle.classList.add('fill');
          });

          optEl.appendChild(circle);
          optEl.appendChild(txt);
          optEl.appendChild(hidden);
          list.appendChild(optEl);
        });

        card.appendChild(list);
      }

      return card;
    }

      $('#sheetTitle').textContent = toArabicDigits(ws.title || "ورقة عمل");

      $('#sec2Wrap').style.display = (ws.sec2 && ws.sec2.length) ? "block" : "none";

    /* --------- Auto generator (مختصر) --------- */
    function detectTopicFromTitle(title){
      const t = toWesternDigits(String(title||'')).toLowerCase();
      if(t.includes("جمع")) return "add";
      if(t.includes("طرح")) return "sub";
      if(t.includes("ضرب")) return "mul";
      if(t.includes("قسمة") || t.includes("القسمة")) return "div";
      if(t.includes("كسر") || t.includes("كسور")) return "fractions";
      if(t.includes("شكل") || t.includes("اشكال")) return "shape2d";
      if(t.includes("مجسم")) return "solids";
      if(t.includes("معادلة")) return "equations";
      if(t.includes("دالة") || t.includes("جدول")) return "functions";
      return "add";
    }

    function extractDivisor(title){
      const norm = toWesternDigits(title||"");
      const m = norm.match(/على\s*(\d{1,2})/);
      if(m) return clamp(parseInt(m[1],10), 2, 12);
      const m2 = norm.match(/(\d{1,2})/);
      if(m2) return clamp(parseInt(m2[1],10), 2, 12);
      return 2;
    }

    function autoWorksheet(){
      const title = ($('#autoTitle').value || "").trim() || "ورقة عمل";
      const topicSel = $('#autoTopic').value;
      const topic = (topicSel==="auto") ? detectTopicFromTitle(title) : topicSel;

      // نموذج بسيط: يخلط 3 أنواع منها الجديد
      if(topic==="div"){
        const d = extractDivisor(title);
        const q1 = 4, q2 = 6;
        const n1 = d*q1, n2 = d*q2;

        return {
          title,
          grade:"ثالث",
          sec1Text:"أجب عن الأسئلة التالية:",
          sec2Text:"تدريب إضافي:",
          sec1:[
            { id: uid(), type:"expr", prompt:"احسب:", op:"÷", left:d, right:n1, correct:q1 },
            { id: uid(), type:"fill", text:`____ ÷ ${toArabicDigits(d)} = ${toArabicDigits(q2)}`, correct:n2 }
          ],
          sec2:[
            { id: uid(), type:"tf", statement:"القسمة عكس الضرب.", correct:true },
            { id: uid(), type:"match",
              colA:[`${toArabicDigits(d)} ÷ ${toArabicDigits(n1)}`, `${toArabicDigits(d)} ÷ ${toArabicDigits(n2)}`],
              colB:[toArabicDigits(q1), toArabicDigits(q2)],
              // المفتاح: A1->B1 , A2->B2
              key:[0,1]
            },
            { id: uid(), type:"prompt", prompt:"اكتب الناتج:", correct:"" },
            { id: uid(), type:"mcq", prompt:"اختر الإجابة الصحيحة: ١٠ ÷ ٥ = ؟", options:["١","٢","٣","٤"], correctIndex:1 }
          ]
        };
      }

      // افتراضي: سؤال حر + صح/خطأ + وصل + أكمل
      return {
        title,
        grade:"ثالث",
        sec1Text:"أجب عن الأسئلة التالية:",
        sec2Text:"تدريب إضافي:",
        sec1:[
          { id: uid(), type:"prompt", prompt:"اكتب إجابتك:", correct:"" },
          { id: uid(), type:"fill", text:"عدد أيام الأسبوع = ____", correct:"7" }
        ],
        sec2:[
          { id: uid(), type:"tf", statement:"العدد ٠ زوجي.", correct:true },
          { id: uid(), type:"match", colA:["٢+٣","٦−١"], colB:["٥","٥"], key:[0,1] },
          { id: uid(), type:"expr", prompt:"احسب:", op:"+", left:3, right:7, correct:10 },
          { id: uid(), type:"mcq", prompt:"اختر الإجابة الصحيحة: ٤×٢ = ؟", options:["٦","٨","١٠","١٢"], correctIndex:1 }
        ]
      };
    }

    async function readFilesToDataUrls(fileList){
      const files = Array.from(fileList || []).slice(0,2);
      const urls = [];
      for(const f of files){
        const url = await new Promise((resolve, reject)=>{
          const r = new FileReader();
          r.onload = ()=> resolve(String(r.result || ""));
          r.onerror = reject;
          r.readAsDataURL(f);
        });
        urls.push(url);
      }
      return urls;
    }

    function setPendingImages(urls){
      state.pendingImages = urls.slice(0,2);
      const box = $('#imgPreview');
      box.innerHTML = '';
      state.pendingImages.forEach(src=>{
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = src;
        img.alt = 'صورة';
        box.appendChild(img);
      });
    }

    $('#qImages').addEventListener('change', async (e)=>{
      const urls = await readFilesToDataUrls(e.target.files);
      setPendingImages(urls);
      e.target.value = "";
    });
    $('#btnClearImages').addEventListener('click', ()=> setPendingImages([]));

      return {
        title: state.custom.title,
        grade: state.custom.grade,
        sec1Text: state.custom.sec1Text,
        sec2Text: state.custom.sec2Text,
        sec1, sec2
      };
    }

    function renderCustomPreview(){
      renderWorksheet(buildWorksheetFromCustom());
    }

    function buildQuestionFromForm(){
      const section = parseInt($('#qSection').value,10);
      const type = $('#qType').value;

      const q = { id: state.editId || uid(), section, type, images: state.pendingImages.slice(0,2) };

      if(type==="prompt"){
        q.prompt = ($('#fPrompt').value||'').trim();
        q.correct = ($('#fCorrect').value||'').trim();
      }

      if(type==="expr"){
        q.prompt = "احسب:";
        q.op = $('#eOp').value;
        const right = parseNum($('#eRight').value);
        const left  = parseNum($('#eLeft').value);
        q.right = Number.isFinite(right) ? right : 0;
        q.left  = Number.isFinite(left)  ? left  : 0;

        const cRaw = ($('#eCorrect').value||'').trim();
        if(cRaw){
          const c = parseNum(cRaw);
          q.correct = Number.isFinite(c) ? c : "";
        }else{
          if(q.op==="+") q.correct = q.right + q.left;
          else if(q.op==="−") q.correct = q.right - q.left;
          else if(q.op==="×") q.correct = q.right * q.left;
          else if(q.op==="÷") q.correct = (q.left!==0 && q.right%q.left===0) ? (q.right/q.left) : "";
        }
      }

      if(type==="fill"){
        q.text = ($('#fillText').value||'').trim();
        const cRaw = ($('#fillCorrect').value||'').trim();
        if(cRaw){
          const c = parseNum(cRaw);
          q.correct = Number.isFinite(c) ? c : cRaw;
        }else{
          q.correct = "";
        }
      }

      if(type==="tf"){
        q.statement = ($('#tfText').value||'').trim();
        const v = ($('#tfCorrect').value||'').trim();
        q.correct = (v==="true") ? true : (v==="false" ? false : null);
      }

      if(type==="match"){
        const a = ($('#mColA').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
        const b = ($('#mColB').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
        q.colA = a;
        q.colB = b;

        const keyRaw = ($('#mKey').value||'').trim();
        if(keyRaw){
          // user writes 1-based indices
          const parts = keyRaw.split(',').map(s=> parseInt(toWesternDigits(s).trim(),10));
          q.key = parts.map(n=> Number.isFinite(n) ? (n-1) : null);
        }else{
          q.key = null;
        }
      }

      if(type==="mcq"){
        q.prompt = ($('#mcqPrompt').value||'').trim();
        q.options = ($('#mcqOptions').value||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6);
        const cRaw = ($('#mcqCorrect').value||'').trim();
        q.correctIndex = cRaw ? (parseInt(toWesternDigits(cRaw),10)-1) : null;
      }

      return q;
    }

    function resetBuilder(){
      state.editId = null;
      $('#btnSaveQuestion').textContent = '➕ إضافة السؤال';
      $('#btnCancelEdit').style.display = 'none';
      $('#qSection').value = "2";
      $('#qType').value = "prompt";
      renderTypeFields();
      setPendingImages([]);
    }

    function renderQuestionList(){
      const list = $('#questionList');
      list.innerHTML = '';
      if(state.custom.questions.length===0){
        const d = document.createElement('div');
        d.style.fontWeight="1000";
        d.style.color="rgba(17,24,39,.65)";
        d.textContent = "لا يوجد أسئلة بعد.";
        list.appendChild(d);
        return;
      }

      state.custom.questions.forEach((q, idx)=>{
        const item = document.createElement('div');
        item.className = 'qItem';

        const meta = document.createElement('div');
        meta.className = 'qMeta';

        const typeName = ({
          prompt:"سؤال حر",
          expr:"تعبير",
          fill:"أكمل",
          tf:"صح/خطأ",
          match:"وصل",
          mcq:"اختيار"
        })[q.type] || "سؤال";

        const summary = q.type==="expr"
          ? `${toArabicDigits(q.right)} ${q.op} ${toArabicDigits(q.left)}`
          : (q.type==="fill" ? (q.text||"") : (q.type==="tf" ? (q.statement||"") : (q.type==="match" ? "وصل بين عمودين" : (q.prompt||""))));

        meta.innerHTML = `
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <span class="pill">س${toArabicDigits(idx+1)}</span>
            <span class="pill">قسم ${toArabicDigits(q.section)}</span>
            <span class="pill">${typeName}</span>
          </div>
          <div style="margin-top:6px;">${toArabicDigits(summary.slice(0,80))}</div>
        `;

        if(q.images && q.images.length){
          const thumbs = document.createElement('div');
          thumbs.className='thumbs';
          q.images.slice(0,2).forEach(src=>{
            const img=document.createElement('img');
            img.className='thumb'; img.src=src;
            thumbs.appendChild(img);
          });
          meta.appendChild(thumbs);
        }

        const actions = document.createElement('div');
        actions.className='qActions';

        const up = document.createElement('button');
        up.className='btn ghost'; up.textContent='⬆️'; up.type='button';
        up.disabled = idx===0;
        up.addEventListener('click', ()=>{
          const arr = state.custom.questions;
          [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
          saveLocal();
          renderQuestionList();
          renderCustomPreview();
        });

        const down = document.createElement('button');
        down.className='btn ghost'; down.textContent='⬇️'; down.type='button';
        down.disabled = idx===state.custom.questions.length-1;
        down.addEventListener('click', ()=>{
          const arr = state.custom.questions;
          [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
          saveLocal();
          renderQuestionList();
          renderCustomPreview();
        });

        const edit = document.createElement('button');
        edit.className='btn'; edit.textContent='✏️ تعديل'; edit.type='button';
        edit.addEventListener('click', ()=> startEdit(q.id));

        const del = document.createElement('button');
        del.className='btn danger'; del.textContent='🗑️ حذف'; del.type='button';
        del.addEventListener('click', ()=>{
          state.custom.questions = state.custom.questions.filter(x=>x.id!==q.id);
          saveLocal();
          renderQuestionList();
          renderCustomPreview();
          if(state.editId===q.id) resetBuilder();
        });

        actions.appendChild(up);
        actions.appendChild(down);
        actions.appendChild(edit);
        actions.appendChild(del);

        item.appendChild(meta);
        item.appendChild(actions);
        list.appendChild(item);
      });
    }

    function startEdit(id){
      const q = state.custom.questions.find(x=>x.id===id);
      if(!q) return;

      state.editId = id;
      $('#btnSaveQuestion').textContent = '💾 حفظ';
      $('#btnCancelEdit').style.display = 'inline-flex';

      $('#qSection').value = String(q.section);
      $('#qType').value = q.type;
      renderTypeFields();

      setPendingImages(q.images || []);

      setTimeout(()=>{
        if(q.type==="prompt"){
          $('#fPrompt').value = q.prompt || "";
          $('#fCorrect').value = q.correct || "";
        }
        if(q.type==="expr"){
          $('#eOp').value = q.op || "÷";
          $('#eRight').value = toArabicDigits(q.right ?? "");
          $('#eLeft').value  = toArabicDigits(q.left ?? "");
          $('#eCorrect').value = (q.correct!=="" && q.correct!==null && q.correct!==undefined) ? toArabicDigits(q.correct) : "";
        }
        if(q.type==="fill"){
          $('#fillText').value = q.text || "";
          $('#fillCorrect').value = (q.correct!=="" && q.correct!==null && q.correct!==undefined) ? toArabicDigits(q.correct) : "";
        }
        if(q.type==="tf"){
          $('#tfText').value = q.statement || "";
          $('#tfCorrect').value = (q.correct===true) ? "true" : (q.correct===false ? "false" : "");
        }
        if(q.type==="match"){
          $('#mColA').value = (q.colA || []).join("\n");
          $('#mColB').value = (q.colB || []).join("\n");
          $('#mKey').value = Array.isArray(q.key) ? q.key.map(x=> (x===null || x===undefined) ? "" : (x+1)).join(",") : "";
        }
        if(q.type==="mcq"){
          $('#mcqPrompt').value = q.prompt || "";
          $('#mcqOptions').value = (q.options || []).join("\n");
          $('#mcqCorrect').value = (q.correctIndex===0 || q.correctIndex) ? String(q.correctIndex+1) : "";
        }
      }, 0);

      window.scrollTo({top:0, behavior:'smooth'});
    }

    /* --------- Export / Import --------- */
    function downloadJSON(obj, filename="worksheet_custom.json"){
      const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    $('#btnExport').addEventListener('click', ()=>{
      syncCustomHeader();
      downloadJSON(state.custom, "worksheet_custom.json");
    });

    $('#importFile').addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        const txt = await file.text();
        const obj = JSON.parse(txt);
        if(!obj || !Array.isArray(obj.questions)) throw new Error("bad");
        state.custom = obj;

        $('#customTitle').value = state.custom.title || "ورقة عمل رياضيات";
        $('#customGrade').value = state.custom.grade || "ثالث";
        $('#customSec1Text').value = state.custom.sec1Text || "القسم (١):";
        $('#customSec2Text').value = state.custom.sec2Text || "القسم (٢):";

        saveLocal();
        renderQuestionList();
        renderCustomPreview();
        resetBuilder();
      }catch(err){
        // ignore
      }finally{
        e.target.value = "";
      }
    });

    /* --------- Check / Clear --------- */
    function checkAll(){
      // inputs
      $$('.ans').forEach(inp=>{
        const correct = inp.dataset.correct;
        inp.classList.remove('correct','wrong');
        if(!correct) return;
        const v = parseNum(inp.value);
        const c = parseInt(correct,10);
        if(Number.isFinite(v) && Number.isFinite(c) && v===c){
          inp.classList.add('correct');
        }else{
          inp.classList.add('wrong');
        }
      });

      // match selects
      $$('.matchSel').forEach(sel=>{
        const c = sel.dataset.correct;
        if(!c && c!=="0") return;
        const expected = parseInt(c,10);
        const chosen = sel.value ? (parseInt(toWesternDigits(sel.value),10)-1) : NaN;
        sel.style.borderColor = '';
        sel.style.boxShadow = '';
        if(Number.isFinite(chosen) && chosen === expected){
          sel.style.borderColor = 'rgba(22,163,74,.55)';
          sel.style.boxShadow = '0 0 0 4px rgba(22,163,74,.12)';
        }else{
          sel.style.borderColor = 'rgba(220,38,38,.55)';
          sel.style.boxShadow = '0 0 0 4px rgba(220,38,38,.10)';
        }
      });

      // true/false + mcq
      $$('input.tfHidden').forEach(r=>{
        const correct = r.dataset.correct;
        if(!correct) return;
        // handled by group; we will validate per group name
      });

      // validate TF groups
      const tfNames = new Set($$('input.tfHidden').map(r=>r.name));
      tfNames.forEach(name=>{
        const radios = $$(`input[name="${name}"]`);
        const any = radios[0];
        if(!any) return;
        const correct = any.dataset.correct;
        if(!correct) return;
        const checked = radios.find(r=>r.checked);
        if(!checked) return;

        const ok = (checked.value === correct);
        // mark circles in that group
        const parent = checked.closest('.tfRow') || checked.closest('.mcqList') || null;
        if(parent){
          // nothing heavy, just keep selection; ok is visual only if needed
        }
      });

      // validate MCQ groups (also stored in tfHidden)
      const mcqNames = new Set($$('input.mcqHidden').map(r=>r.name));
      mcqNames.forEach(name=>{
        const radios = $$(`input[name="${name}"]`);
        if(!radios.length) return;
        const correct = radios[0].dataset.correct;
        if(correct==="" || correct===undefined) return;
        const checked = radios.find(r=>r.checked);
        if(!checked) return;
        const ok = (parseInt(checked.value,10) === parseInt(correct,10));
        // nothing else
      });
    }

    function clearAll(){
      $$('.ans').forEach(inp=>{
        inp.value='';
        inp.classList.remove('correct','wrong');
      });
      $$('.matchSel').forEach(sel=>{
        sel.value="";
        sel.style.borderColor='';
        sel.style.boxShadow='';
      });
      $$('.tfCircle').forEach(c=> c.classList.remove('fill'));
    }

    $('#btnCheck').addEventListener('click', checkAll);
    $('#btnClear').addEventListener('click', clearAll);
    $('#btnPrint').addEventListener('click', ()=> window.print());

    /* --------- Tabs --------- */
    function setMode(mode){
      state.mode = mode;
      $('#tabAuto').classList.toggle('active', mode==="auto");
      $('#tabCustom').classList.toggle('active', mode==="custom");
      $('#autoPanel').style.display = (mode==="auto") ? "block" : "none";
      $('#customPanel').style.display = (mode==="custom") ? "block" : "none";

      if(mode==="auto") generateAuto();
      else renderCustomPreview();
    }

    $('#tabAuto').addEventListener('click', ()=> setMode("auto"));
    $('#tabCustom').addEventListener('click', ()=> setMode("custom"));

    /* --------- Wire auto/custom --------- */
    $('#btnAutoGenerate').addEventListener('click', generateAuto);

    $('#qType').addEventListener('change', renderTypeFields);

    $('#btnCancelEdit').addEventListener('click', resetBuilder);

    $('#btnSaveQuestion').addEventListener('click', ()=>{
      syncCustomHeader();
      const q = buildQuestionFromForm();

      const idx = state.custom.questions.findIndex(x=>x.id===q.id);
      if(idx>=0) state.custom.questions[idx] = q;
      else state.custom.questions.push(q);

      saveLocal();
      renderQuestionList();
      renderCustomPreview();
      resetBuilder();
    });

    ['customTitle','customGrade','customSec1Text','customSec2Text'].forEach(id=>{
      const el=document.getElementById(id);
      el.addEventListener('input', ()=>{
        syncCustomHeader();
        renderCustomPreview();
      });
      el.addEventListener('change', ()=>{
        syncCustomHeader();
        renderCustomPreview();
      });
    });

    /* --------- Init --------- */
    loadLocal();
    $('#customTitle').value = state.custom.title || "ورقة عمل رياضيات";
    $('#customGrade').value = state.custom.grade || "ثالث";
    $('#customSec1Text').value = state.custom.sec1Text || "القسم (١):";
    $('#customSec2Text').value = state.custom.sec2Text || "القسم (٢):";

    renderTypeFields();
    renderQuestionList();
    setMode("auto");
  </script>
</body>
</html>
