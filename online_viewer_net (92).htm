<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مولد أوراق العمل | رياضيات</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#111827;
      --muted:#6b7280;
      --dash:#9ca3af;

      --accent:#7c5cff;
      --accent2:#ef7aa8;
      --good:#16a34a;
      --bad:#dc2626;

      /* print-friendly sizing */
      --pagePad: 18px;
      --pageBorder: 4px;
      --innerInset: 9px;

      --titleSize: 26px;
      --infoSize: 13.8px;
      --secSize: 15px;
      --secNum: 18px;
      --eqSize: 13.5px;

      --blankW: 110px;

      --card: rgba(255,255,255,.90);
      --border: rgba(17,24,39,.12);
      --shadow: 0 10px 30px rgba(17,24,39,.10);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:'Tajawal', system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(239,122,168,.16) 0%, rgba(255,255,255,0) 60%),
        radial-gradient(1000px 700px at 80% 20%, rgba(124,92,255,.14) 0%, rgba(255,255,255,0) 62%),
        #ffffff;
      min-height:100vh;
    }
    .wrap{ max-width:1180px; margin:auto; padding:16px; }

    /* ===== Toast (minimal, not cluttering) ===== */
    .toast{
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      margin: 0 auto;
      max-width: 520px;
      z-index: 9999;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(17,24,39,.14);
      box-shadow: 0 10px 30px rgba(17,24,39,.12);
      font-weight: 900;
      color: rgba(17,24,39,.90);
      display:none;
      backdrop-filter: blur(10px);
    }
    .toast.show{ display:block; }
    .toast.ok{ border-color: rgba(22,163,74,.25); background: rgba(22,163,74,.08); }
    .toast.bad{ border-color: rgba(220,38,38,.25); background: rgba(220,38,38,.08); }

    /* ===== App Bar ===== */
    .appBar{
      background: var(--card);
      border: 1px solid rgba(124,92,255,.18);
      border-radius: var(--radius);
      padding: 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 280px;
    }
    .logoWrap{
      width:52px;
      height:52px;
      border-radius:16px;
      border: 1px solid rgba(124,92,255,.22);
      background: linear-gradient(135deg, rgba(124,92,255,.12), rgba(239,122,168,.10));
      display:grid;
      place-items:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .logoWrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .brandTitle{
      font-weight:1000;
      font-size:18px;
      line-height:1.2;
    }
    .brandSub{
      font-weight:800;
      font-size:12.5px;
      color: var(--muted);
      margin-top:2px;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
    }
    .tabBtn{
      border:none;
      cursor:pointer;
      padding:9px 12px;
      border-radius: 999px;
      background:#fff;
      border:1px solid rgba(17,24,39,.12);
      font-weight:1000;
      transition:.12s ease;
      display:inline-flex;
      gap:8px;
      align-items:center;
      white-space:nowrap;
    }
    .tabBtn.active{
      background: linear-gradient(135deg, rgba(124,92,255,.18), rgba(239,122,168,.16));
      border-color: rgba(124,92,255,.25);
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .btn{
      border:none;
      cursor:pointer;
      padding:10px 12px;
      border-radius: 14px;
      background:#fff;
      border:1px solid rgba(17,24,39,.12);
      box-shadow: 0 6px 18px rgba(17,24,39,.08);
      font-weight:1000;
      transition: transform .12s ease, box-shadow .12s ease;
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 22px rgba(17,24,39,.10); }
    .btn.primary{
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(239,122,168,.90));
      color:#fff;
      border-color: transparent;
      box-shadow: 0 10px 22px rgba(124,92,255,.18);
    }
    .btn.ghost{
      background: transparent;
      border-color: rgba(124,92,255,.22);
      box-shadow:none;
    }

    /* ===== Panels ===== */
    .panel{
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 10px 30px rgba(17,24,39,.08);
    }
    .panelTitle{
      font-weight:1000;
      font-size:15px;
      margin-bottom:10px;
      color: rgba(17,24,39,.92);
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
    }
    .col{ flex: 1 1 260px; min-width: 260px; }
    .col.small{ flex: 1 1 180px; min-width: 180px; }
    .col.tiny{ flex: 0 0 170px; min-width:170px; }

    label{
      display:block;
      font-weight:1000;
      font-size:12.5px;
      color: rgba(17,24,39,.85);
      margin:0 0 6px;
    }
    input[type="text"], select, textarea{
      width:100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.14);
      background:#fff;
      font-weight:900;
      outline:none;
    }
    textarea{
      min-height: 70px;
      resize: vertical;
      font-weight:800;
      line-height:1.6;
    }
    .check{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:1000;
      cursor:pointer;
      user-select:none;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.10);
      background:#fff;
    }
    .check input{ width:18px; height:18px; cursor:pointer; }

    .hr{
      height:1px;
      background: rgba(17,24,39,.10);
      margin: 12px 0;
    }

    /* ===== Question list ===== */
    .qList{ display:flex; flex-direction:column; gap:8px; }
    .qItem{
      background:#fff;
      border:1px solid rgba(17,24,39,.10);
      border-radius: 16px;
      padding:10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .qMeta{
      font-weight:900;
      color: rgba(17,24,39,.86);
      line-height:1.5;
      max-width: 720px;
    }
    .qActions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius: 999px;
      background: rgba(124,92,255,.10);
      border: 1px solid rgba(124,92,255,.16);
      font-weight:1000;
      font-size:12px;
    }
    .thumbs{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .thumb{
      width: 84px;
      height: 56px;
      border-radius: 12px;
      border: 1px solid rgba(17,24,39,.12);
      object-fit: cover;
      background:#fff;
    }

    /* ===== Worksheet Page ===== */
    .page{
      margin-top: 14px;
      background:#fff;
      border: var(--pageBorder) dashed var(--dash);
      border-radius: 22px;
      padding: var(--pagePad);
      position:relative;
    }
    .page::before{
      content:"";
      position:absolute;
      inset: var(--innerInset);
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      pointer-events:none;
    }

    .sheetTitle{
      text-align:center;
      font-weight:1000;
      font-size: var(--titleSize);
      margin: 2px 0 10px;
      position:relative;
      z-index:1;
    }
    .infoBar{
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 8px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin: 0 4px 10px;
      position:relative;
      z-index:1;
    }
    .infoItem{
      font-weight:1000;
      font-size: var(--infoSize);
      display:flex;
      align-items:center;
      gap:10px;
      color: rgba(17,24,39,.90);
    }
    .dots{
      display:inline-block;
      width: 300px;
      max-width: 52vw;
      border-bottom: 3px dotted rgba(17,24,39,.35);
      transform: translateY(-2px);
      height: 15px;
    }
    .dots.small{ width: 180px; max-width: 40vw; }

    .sec{
      margin: 8px 6px 0;
      position:relative;
      z-index:1;
    }
    .secHead{
      display:flex;
      align-items:flex-start;
      gap:10px;
      margin: 6px 0 6px;
    }
    .secNum{
      font-weight:1000;
      font-size: var(--secNum);
      line-height: 1;
      margin-top: 2px;
      min-width: 24px;
      text-align:center;
      color: rgba(17,24,39,.88);
    }
    .secText{
      font-weight:1000;
      font-size: var(--secSize);
      color: rgba(17,24,39,.88);
      line-height:1.6;
    }

    .sec1Grid, .sec2Grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      align-items:start;
    }
    @media (max-width: 880px){
      .sec1Grid, .sec2Grid{ grid-template-columns: 1fr; }
      .col{ min-width: 220px; }
    }

    .cardQ{
      border: 1px solid rgba(17,24,39,.10);
      background: #fff;
      border-radius: 16px;
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      break-inside: avoid;
      position:relative;
      overflow:hidden;
    }
    .cardQ::before{
      content:"";
      position:absolute;
      inset:-60px -80px auto auto;
      width:160px; height:160px;
      border-radius:999px;
      background: radial-gradient(circle at 40% 40%, rgba(124,92,255,.12), rgba(239,122,168,.08), rgba(255,255,255,0) 65%);
      transform: rotate(20deg);
      pointer-events:none;
    }

    .qPrompt{
      font-weight:1000;
      font-size: 13.6px;
      line-height: 1.7;
      color: rgba(17,24,39,.92);
      position:relative;
      z-index:1;
      white-space: pre-wrap;
    }

    .mediaBox{
      border: 1px dashed rgba(124,92,255,.30);
      background: rgba(124,92,255,.05);
      border-radius: 14px;
      padding: 8px;
      position:relative;
      z-index:1;
    }
    .imgRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }
    .qImg{
      max-width: 100%;
      max-height: 120px;
      border-radius: 12px;
      border: 1px solid rgba(17,24,39,.10);
      object-fit: contain;
      background:#fff;
    }
    .svgWrap{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }

    .eqRow{
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap: 10px;
      font-weight:1000;
      font-size: var(--eqSize);
      color: rgba(17,24,39,.88);
      position:relative;
      z-index:1;
      flex-wrap:wrap;
    }

    /* Expression: left operand then op then right operand, with direction:ltr to lock display.
       For division/subtraction use: (left = divisor/subtrahend), (right = dividend/minuend) */
    .expr{
      min-width: 160px;
      display:flex;
      flex-direction:row;
      direction:ltr;
      justify-content:flex-end;
      align-items:center;
      gap:6px;
      text-align:right;
    }
    .expr .num{ font-weight:1000; letter-spacing:.2px; }
    .expr .op{ font-weight:1000; padding:0 2px; }

    .blank{
      display:inline-flex;
      align-items:flex-end;
      gap: 8px;
    }
    .ans{
      width: var(--blankW);
      padding: 7px 8px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.18);
      font-weight:1000;
      text-align:center;
      outline:none;
      background:#fff;
      transition: box-shadow .12s ease, border-color .12s ease;
      font-size: 13.5px;
    }
    .ans.correct{ border-color: rgba(22,163,74,.55); box-shadow: 0 0 0 4px rgba(22,163,74,.12); }
    .ans.wrong{ border-color: rgba(220,38,38,.55); box-shadow: 0 0 0 4px rgba(220,38,38,.10); }

    .printLine{
      display:none;
      width: calc(var(--blankW) + 18px);
      border-bottom: 3px dotted rgba(17,24,39,.35);
      transform: translateY(-2px);
      height: 15px;
    }

    /* Answer-writing + related facts */
    .noteBox{
      border: 1px dashed rgba(239,122,168,.32);
      background: rgba(239,122,168,.05);
      border-radius: 14px;
      padding: 8px 10px;
      position:relative;
      z-index:1;
    }
    .noteLabel{
      font-weight:1000;
      font-size: 12.6px;
      color: rgba(17,24,39,.82);
      margin-bottom: 6px;
    }
    .noteInput{
      width:100%;
      min-height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.16);
      padding: 8px 10px;
      font-weight:800;
      outline:none;
      resize: none;
      line-height:1.6;
      background:#fff;
      font-size: 12.8px;
    }
    .factsInput{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.16);
      padding: 8px 10px;
      font-weight:900;
      outline:none;
      background:#fff;
      font-size: 12.8px;
    }
    .noteInput.ok, .factsInput.ok{
      border-color: rgba(22,163,74,.55);
      box-shadow: 0 0 0 4px rgba(22,163,74,.12);
    }
    .noteInput.bad, .factsInput.bad{
      border-color: rgba(220,38,38,.55);
      box-shadow: 0 0 0 4px rgba(220,38,38,.10);
    }
    .notePrint{ display:none; margin-top: 6px; }
    .noteLine{
      height: 16px;
      border-bottom: 2px dotted rgba(17,24,39,.35);
      margin-top: 8px;
    }
    .factsPrint{
      display:none;
      height: 16px;
      border-bottom: 2px dotted rgba(17,24,39,.35);
      margin-top: 8px;
    }

    /* tables */
    .tblWrap{
      border: 1px dashed rgba(124,92,255,.28);
      background: rgba(124,92,255,.05);
      border-radius: 14px;
      padding: 8px;
      position:relative;
      z-index:1;
      overflow:auto;
    }
    table.wsTable{
      width:100%;
      border-collapse:collapse;
      font-size: 12.6px;
      background:#fff;
      border-radius: 12px;
      overflow:hidden;
      border: 1px solid rgba(17,24,39,.10);
    }
    table.wsTable th, table.wsTable td{
      border: 1px solid rgba(17,24,39,.10);
      padding: 8px;
      text-align:center;
      font-weight:1000;
      white-space:nowrap;
    }
    table.wsTable th{
      background: rgba(124,92,255,.08);
    }

    /* MCQ */
    .mcqList{ display:flex; flex-direction:column; gap:8px; position:relative; z-index:1; }
    .mcqOpt{
      display:flex;
      gap:10px;
      align-items:flex-start;
      font-weight:1000;
      font-size: 13px;
      line-height:1.6;
      padding:8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.10);
      background: rgba(255,255,255,.9);
      cursor:pointer;
      user-select:none;
    }
    .mcqCircle{
      width:16px; height:16px;
      border-radius:999px;
      border:2px solid rgba(17,24,39,.45);
      margin-top: 2px;
      flex:0 0 auto;
      position:relative;
    }
    .mcqCircle.fill::after{
      content:"";
      position:absolute;
      inset:3px;
      border-radius:999px;
      background: rgba(124,92,255,.85);
    }
    .mcqHidden{ display:none; }

    .bottomBar{
      margin: 10px 6px 0;
      padding-top: 8px;
      border-top: 1px solid rgba(17,24,39,.10);
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      font-weight:1000;
      color: rgba(17,24,39,.75);
      position:relative;
      z-index:1;
      font-size: 12.8px;
    }

    /* Footer in app only */
    .appFooter{
      margin-top: 10px;
      text-align:center;
      font-weight:1000;
      color: rgba(17,24,39,.70);
      font-size: 12.6px;
    }

    /* Print */
    @page{ size: A4; margin: 10mm; }
    @media print{
      body{ background:#fff; }
      .wrap{ max-width: unset; padding:0; }
      .noPrint{ display:none !important; }
      .appFooter{ display:none !important; }
      .toast{ display:none !important; }

      .ans{ display:none !important; }
      .printLine{ display:inline-block !important; }

      .noteInput{ display:none !important; }
      .factsInput{ display:none !important; }
      .notePrint{ display:block !important; }
      .factsPrint{ display:block !important; }

      .page{ break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>

<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="wrap">

    <!-- ===== APP BAR ===== -->
    <div class="appBar noPrint">
      <div class="brand">
        <div class="logoWrap">
          <img id="appLogo" alt="شعار الملتقى">
        </div>
        <div>
          <div class="brandTitle">مولد أوراق العمل (رياضيات)</div>
          <div class="brandSub">ملتقى التعليم التفاعلي</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tabBtn active" id="tabAuto" type="button">⚡ توليد تلقائي</button>
        <button class="tabBtn" id="tabCustom" type="button">🧾 توليد ذاتي</button>
      </div>

      <div class="actions">
        <button class="btn" id="btnCheck" type="button">✅ تحقّق</button>
        <button class="btn ghost" id="btnClear" type="button">🧹 مسح</button>
        <button class="btn" id="btnPrint" type="button">🖨️ طباعة</button>
      </div>
    </div>

    <!-- ===== AUTO PANEL ===== -->
    <div class="panel noPrint" id="autoPanel">
      <div class="panelTitle">التوليد التلقائي</div>

      <div class="row">
        <div class="col">
          <label for="autoTitle">عنوان الدرس</label>
          <input id="autoTitle" type="text" value="القسمة على ٥" />
        </div>

        <div class="col small">
          <label for="autoTopic">نوع الدرس</label>
          <select id="autoTopic">
            <option value="auto" selected>تلقائي حسب العنوان</option>
            <option value="add">جمع</option>
            <option value="sub">طرح</option>
            <option value="mul">ضرب</option>
            <option value="div">قسمة</option>
            <option value="fractions">كسور</option>
            <option value="shape2d">أشكال ثنائية الأبعاد</option>
            <option value="solids">مجسمات</option>
            <option value="equations">معادلات</option>
            <option value="functions">جداول دوال</option>
          </select>
        </div>

        <div class="col small">
          <label for="autoLevel">الصعوبة</label>
          <select id="autoLevel">
            <option value="easy" selected>سهل</option>
            <option value="mid">متوسط</option>
            <option value="hard">متقدم</option>
          </select>
        </div>

        <div class="col small">
          <label class="check" style="margin-top:22px;">
            <input type="checkbox" id="autoVisuals" checked>
            رسوم توضيحية
          </label>
        </div>

        <div class="col tiny">
          <button class="btn primary" id="btnAutoGenerate" type="button">✨ توليد</button>
        </div>
      </div>
    </div>

    <!-- ===== CUSTOM PANEL ===== -->
    <div class="panel noPrint" id="customPanel" style="display:none;">
      <div class="panelTitle">التوليد الذاتي</div>

      <div class="row">
        <div class="col">
          <label for="customTitle">عنوان ورقة العمل</label>
          <input id="customTitle" type="text" value="ورقة عمل رياضيات" />
        </div>
        <div class="col small">
          <label for="customGrade">الصف</label>
          <select id="customGrade">
            <option selected>ثالث</option>
            <option>رابع</option>
            <option>خامس</option>
            <option>سادس</option>
            <option>عام</option>
          </select>
        </div>
        <div class="col">
          <label for="customSec1Text">عنوان القسم (١)</label>
          <input id="customSec1Text" type="text" value="أجب عن الأسئلة التالية:" />
        </div>
        <div class="col">
          <label for="customSec2Text">عنوان القسم (٢)</label>
          <input id="customSec2Text" type="text" value="تدريب إضافي:" />
        </div>
      </div>

      <div class="hr"></div>

      <div class="panelTitle">إضافة/تعديل سؤال</div>

      <div class="row">
        <div class="col small">

    // ===== Arabic digits helpers =====
    const AR_NUMS = "٠١٢٣٤٥٦٧٨٩";
    const FA_NUMS = "۰۱۲۳۴۵۶۷۸۹";
    const toArabicDigits = (input) => String(input ?? "")
      .replace(/\d/g, d => AR_NUMS[d])
      .replace(/[۰-۹]/g, d => AR_NUMS[FA_NUMS.indexOf(d)]);
    const toWesternDigits = (input) => String(input ?? "")
      .replace(/[٠-٩]/g, d => String(AR_NUMS.indexOf(d)))
      .replace(/[۰-۹]/g, d => String(FA_NUMS.indexOf(d)));
    const parseNum = (v) => {
      const s = toWesternDigits(String(v ?? "")).replace(/[^\d-]/g,'');
      if(!s) return NaN;
      return parseInt(s, 10);
    };
    const normalizeText = (s) => String(s ?? "")
      .trim()
      .replace(/\s+/g, " ")
      .replace(/[٠-٩]/g, d => String(AR_NUMS.indexOf(d)))
      .toLowerCase();
    const normalizeFact = (s) => {
      let t = toWesternDigits(String(s || '')).toLowerCase();
      t = t.replace(/\s+/g,'');
      t = t.replace(/[×✕＊]/g,'x');
      t = t.replace(/[*]/g,'x');
      t = t.replace(/[＝]/g,'=');
      t = t.replace(/[^0-9x=\/\\]/g,'');
      return t;
    };
    const normalizeFrac = (s) => {
      const t = toWesternDigits(String(s||'')).replace(/\s+/g,'');
      const m = t.match(/^(\d{1,2})[\/\\](\d{1,2})$/);
      if(m) return `${parseInt(m[1],10)}/${parseInt(m[2],10)}`;
      return t.toLowerCase();

    function svgArray(rows, cols){
      const w=300,h=130;
      const cell=14,gap=6;
      const gridW = cols*cell + (cols-1)*gap;
      const gridH = rows*cell + (rows-1)*gap;
      const x0 = Math.max(18, (w-gridW)/2);
      const y0 = 44;
      let out='';
      const capCells = Math.min(rows*cols, 48);
      for(let i=0;i<capCells;i++){
        const r = Math.floor(i/cols), c=i%cols;
        out += `<rect x="${x0+c*(cell+gap)}" y="${y0+r*(cell+gap)}" width="${cell}" height="${cell}" rx="3"
                fill="rgba(124,92,255,.12)" stroke="rgba(17,24,39,.12)"/>`;
      }
      return `
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="${w-12}" height="${h-12}" rx="16" fill="rgba(124,92,255,.05)" stroke="rgba(17,24,39,.18)"/>

        </text>
        ${out}
      </svg>`;
    }

    function svgGroups(divisor, quotient){
      const w=300,h=140,pad=16;
      const cols = divisor<=4 ? divisor : 3;
      const rows = Math.ceil(divisor/cols);
      const boxW = (w - pad*2 - (cols-1)*10) / cols;
      const boxH = (h - 50 - pad - (rows-1)*10) / rows;

      let g='';
      for(let i=0;i<divisor;i++){
        const r = Math.floor(i/cols), c=i%cols;
        const x = pad + c*(boxW+10);
        const y = 42 + r*(boxH+10);
        g += `<rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="14" fill="rgba(239,122,168,.05)" stroke="rgba(17,24,39,.25)"/>`;

        const dot = 6;
        const perRow = Math.max(1, Math.floor((boxW-16)/(dot+6)));
        for(let k=0;k<quotient;k++){
          const rr = Math.floor(k/perRow), cc = k%perRow;
          const dx = x+14 + cc*(dot+6);
          const dy = y+18 + rr*(dot+8);
          g += `<circle cx="${dx}" cy="${dy}" r="${dot/2}" fill="rgba(124,92,255,.75)"/>`;
        }
      }

      return `
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="${w-12}" height="${h-12}" rx="16" fill="rgba(239,122,168,.05)" stroke="rgba(17,24,39,.18)"/>

          مجموعات: ${toArabicDigits(divisor)} × (في كل مجموعة ${toArabicDigits(quotient)})
        </text>
        ${g}
      </svg>`;
    }

    function svgFractionBar(numer, denom){
      const w = 300, h = 70, pad = 10;

    function svgFunctionTable(ruleText, inputs, outputs, blanksMask){
      const cols = inputs.length;
      let th = `<th>المدخل</th>` + inputs.map(x=>`<th>${toArabicDigits(x)}</th>`).join('');
      let outRow = `<td>المخرج</td>`;
      for(let i=0;i<cols;i++){
        if(blanksMask[i]){
          outRow += `<td data-blank="1" data-correct="${outputs[i]}"></td>`;
        }else{
          outRow += `<td>${toArabicDigits(outputs[i])}</td>`;
        }
      }
      return `
        <div class="tblWrap">
          <div style="font-weight:1000; color:rgba(17,24,39,.80); margin-bottom:6px;">قاعدة الدالة: ${toArabicDigits(ruleText)}</div>
          <table class="wsTable">
            <tr>${th}</tr>
            <tr>${outRow}</tr>
          </table>
        </div>`;
    }

    // ===== Render helpers =====
    function renderMedia(media){
      if(!media) return null;
      const mediaEl = document.createElement('div');
      mediaEl.className = 'mediaBox';

      if(media.type === "svg"){
        mediaEl.innerHTML = svgWrap(media.svg);
        return mediaEl;
      }
      if(media.type === "images" && media.images?.length){
        const row = document.createElement('div');
        row.className = 'imgRow';
        media.images.slice(0,2).forEach(src=>{
          const img = document.createElement('img');
          img.className = 'qImg';
          img.src = src;
          img.alt = 'صورة';
          row.appendChild(img);
        });
        mediaEl.appendChild(row);
        return mediaEl;
      }
      return null;
    }

    function buildExpr(leftOperand, op, rightOperand){
      const el = document.createElement('div');
      el.className = 'expr';
      const left = document.createElement('span'); left.className='num'; left.textContent = toArabicDigits(leftOperand);
      const o = document.createElement('span'); o.className='op'; o.textContent = op;
      const right = document.createElement('span'); right.className='num'; right.textContent = toArabicDigits(rightOperand);
      el.appendChild(left); el.appendChild(o); el.appendChild(right);
      return el;
    }

    function makePrintLines(n){
      const box = document.createElement('div');
      box.className = 'notePrint printOnly';
      const lines = Math.max(1, Math.min(5, parseInt(n||1,10)));
      for(let i=0;i<lines;i++){
        const line = document.createElement('div');
        line.className = 'noteLine';
        box.appendChild(line);
      }
      return box;
    }

    function renderExtras(q, parent){
      if(q.answerWrite?.enabled){
        const box = document.createElement('div');
        box.className = 'noteBox';
        const label = document.createElement('div');
        label.className = 'noteLabel';
        label.textContent = toArabicDigits(q.answerWrite.prompt || "اكتب إجابتك:");
        const ta = document.createElement('textarea');
        ta.className = 'noteInput noPrint';
        ta.placeholder = '...';
        ta.dataset.required = q.answerWrite.required ? "1" : "0";
        const lines = Math.max(1, Math.min(5, parseInt(q.answerWrite.lines||2,10)));
        ta.rows = lines;
        ta.addEventListener('blur', ()=>{ ta.value = toArabicDigits(ta.value); });
        box.appendChild(label);
        box.appendChild(ta);
        box.appendChild(makePrintLines(lines));
        parent.appendChild(box);
      }

      if(q.facts?.enabled){
        const box = document.createElement('div');
        box.className = 'noteBox';
        const label = document.createElement('div');
        label.className = 'noteLabel';
        label.textContent = toArabicDigits(q.facts.prompt || "اكتب الحقائق المترابطة:");
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'factsInput noPrint';
        inp.placeholder = '...';
        inp.dataset.required = q.facts.required ? "1" : "0";
        inp.dataset.key = (q.facts.key||"").trim();
        inp.addEventListener('input', ()=>{ inp.value = toArabicDigits(inp.value); });
        const print = document.createElement('div');
        print.className = 'factsPrint printOnly';
        box.appendChild(label);
        box.appendChild(inp);
        box.appendChild(print);
        parent.appendChild(box);
      }
    }

    function makeAnswerInput({correctValue=null, answerType="num"}){
      const span = document.createElement('span');
      span.className = 'blank';

      const inp = document.createElement('input');
      inp.className = 'ans noPrint';
      inp.type = 'text';
      inp.autocomplete = "off";
      inp.spellcheck = false;
      inp.dataset.atype = answerType;

      if(answerType === "num"){
        inp.inputMode = "numeric";
        inp.dataset.correct = (correctValue===null || correctValue===undefined || correctValue==="") ? "" : String(correctValue);
        inp.addEventListener('input', ()=>{
          const raw = toWesternDigits(inp.value).replace(/[^\d-]/g,'');
          inp.value = toArabicDigits(raw);
        });
      } else if(answerType === "frac"){
        inp.inputMode = "text";
        inp.dataset.correct = (correctValue===null || correctValue===undefined || correctValue==="") ? "" : normalizeFrac(correctValue);
        inp.placeholder = "مثال: ٣/٤";
        inp.addEventListener('blur', ()=>{ inp.value = toArabicDigits(inp.value); });
      } else {
        inp.inputMode = "text";
        inp.dataset.correct = (correctValue===null || correctValue===undefined || correctValue==="") ? "" : normalizeText(correctValue);
        inp.addEventListener('blur', ()=>{ inp.value = toArabicDigits(inp.value); });
      }

      const line = document.createElement('span');
      line.className = 'printLine printOnly';

      span.appendChild(inp);
      span.appendChild(line);
      return span;
    }

    function renderQuestion(q){
      const card = document.createElement('div');
      card.className = 'cardQ';

      const m = renderMedia(q.media);
      if(m) card.appendChild(m);

      if(q.prompt){
        const p = document.createElement('div');
        p.className = 'qPrompt';
        p.textContent = toArabicDigits(q.prompt);
        card.appendChild(p);
      }

      if(q.type === "expr"){
        const row = document.createElement('div');
        row.className = 'eqRow';

        // leftOperand on the left, rightOperand on the right (locked by direction:ltr)
        // For division: left = divisor, right = dividend (big number on right)
        const expr = buildExpr(q.left, q.op, q.right);

        const eq = document.createElement('div');
        eq.textContent = "=";

        const blank = makeAnswerInput({ correctValue: q.correct ?? "", answerType: q.answerType ?? "num" });

        row.appendChild(expr);
        row.appendChild(eq);
        row.appendChild(blank);
        card.appendChild(row);
      }

      if(q.type === "prompt"){
        const row = document.createElement('div');
        row.className = 'eqRow';
        const blank = makeAnswerInput({ correctValue: q.correct ?? "", answerType: q.answerType ?? "num" });
        row.appendChild(blank);
        card.appendChild(row);
      }

      if(q.type === "equation"){
        const row = document.createElement('div');
        row.className = 'eqRow';

        const t = document.createElement('div');
        t.style.fontWeight = "1000";
        t.textContent = toArabicDigits(q.eqText || "أوجد قيمة س:");

        const blank = makeAnswerInput({ correctValue: q.correct ?? "", answerType:"num" });
        row.appendChild(t);
        row.appendChild(blank);

        const eqLine = document.createElement('div');
        eqLine.className = 'qPrompt';
        eqLine.textContent = toArabicDigits(q.equation || "");

        card.appendChild(row);
        card.appendChild(eqLine);
      }

      if(q.type === "table"){
        const holder = document.createElement('div');
        holder.className = 'tblWrap';
        holder.innerHTML = q.tableHtml || "";
        $$('td[data-blank="1"]', holder).forEach(td=>{
          const correct = td.getAttribute('data-correct') || "";
          td.innerHTML = "";
          td.appendChild(makeAnswerInput({ correctValue: correct, answerType:"num" }));
        });
        card.appendChild(holder);
      }

      if(q.type === "mcq"){
        const list = document.createElement('div');
        list.className = 'mcqList';

        q.options.forEach((opt, idx)=>{
          const optEl = document.createElement('div');
          optEl.className = 'mcqOpt';

          const circle = document.createElement('span');
          circle.className = 'mcqCircle';

          const txt = document.createElement('div');
          txt.textContent = toArabicDigits(opt);

          const hidden = document.createElement('input');
          hidden.type = "radio";
          hidden.name = "mcq_" + q.id;
          hidden.value = String(idx);
          hidden.className = "mcqHidden";
          hidden.dataset.correct = (q.correctIndex ?? -1);

          optEl.addEventListener('click', ()=>{
            $$(`input[name="mcq_${q.id}"]`).forEach(r=> r.checked = false);
            hidden.checked = true;
            $$('.mcqCircle', list).forEach(c=> c.classList.remove('fill'));
            circle.classList.add('fill');
          });

          optEl.appendChild(circle);
          optEl.appendChild(txt);
          optEl.appendChild(hidden);
          list.appendChild(optEl);
        });

        card.appendChild(list);
      }

      renderExtras(q, card);
      return card;
    }

    function renderWorksheet(ws){
      $('#sheetTitle').textContent = toArabicDigits(ws.title || "ورقة عمل");
      $('#sec1Text').textContent = toArabicDigits(ws.sec1Text || "القسم (١)");

    // ===== Auto topic detection =====
    function detectTopicFromTitle(title){
      const t = normalizeText(title);
      if(!t) return "add";
      if(t.includes("جمع")) return "add";
      if(t.includes("طرح")) return "sub";
      if(t.includes("ضرب")) return "mul";
      if(t.includes("قسمة") || t.includes("القسمة")) return "div";
      if(t.includes("كسر") || t.includes("كسور") || t.includes("مقام") || t.includes("بسط")) return "fractions";
      if(t.includes("شكل") || t.includes("اشكال") || t.includes("ثنائي") || t.includes("أضلاع") || t.includes("زوايا")) return "shape2d";
      if(t.includes("مجسم") || t.includes("مجسمات") || t.includes("وجه") || t.includes("حرف") || t.includes("رأس")) return "solids";
      if(t.includes("معادلة") || t.includes("معادلات") || t.includes("مجهول")) return "equations";
      if(t.includes("دالة") || t.includes("دوال") || t.includes("جدول") || t.includes("مدخلات") || t.includes("مخرجات")) return "functions";
      return "add";
    }

    function extractDivisor(title){
      const norm = toWesternDigits(title||'');
      const m = norm.match(/على\s*(\d{1,2})/);
      if(m) return clamp(parseInt(m[1],10), 2, 12);
      const m2 = norm.match(/(\d{1,2})/);
      if(m2) return clamp(parseInt(m2[1],10), 2, 12);
      return 2;
    }

    function genFunctions(level, visuals){
      const ruleType = pick(["+","×"]);
      const n = (ruleType==="+") ? randInt(2,6) : randInt(2,4);
      const inputs = [1,2,3,4].map(x=> x*randInt(1,3));
      const outputs = inputs.map(x=> ruleType==="+" ? x+n : x*n);
      const mask = [true,false,true,false];
      const tableHtml = svgFunctionTable(
        ruleType==="+" ? `+ ${toArabicDigits(n)}` : `× ${toArabicDigits(n)}`,
        inputs, outputs, mask
      );

      return {
        title:"ورقة عمل: جداول الدوال",
        grade:"ثالث",
        sec1Text:"أكمل جدول الدالة:",
        sec2Text:"تدريب إضافي:",

    // ===== Auto orchestrator =====
    function generateAuto(){
      const title = ($('#autoTitle').value || '').trim() || "ورقة عمل رياضيات";
      const topicSel = $('#autoTopic').value;
      const level = $('#autoLevel').value;
      const visuals = $('#autoVisuals').checked;

      const topic = (topicSel === "auto") ? detectTopicFromTitle(title) : topicSel;

      let ws;
      if(topic==="add") ws = genAdd(level, visuals);
      else if(topic==="sub") ws = genSub(level, visuals);
      else if(topic==="mul") ws = genMul(level, visuals);
      else if(topic==="div") ws = genDiv(level, title, visuals);
      else if(topic==="fractions") ws = genFractions(level, visuals);
      else if(topic==="shape2d") ws = genShape2D(level, visuals);
      else if(topic==="solids") ws = genSolids(level, visuals);
      else if(topic==="equations") ws = genEquations(level, visuals);
      else ws = genFunctions(level, visuals);

      ws.title = title;
      renderWorksheet(ws);
      showToast(`تم توليد ورقة: ${topicLabel(topic)}`, "ok");
    }

    async function readFilesToDataUrls(fileList){
      const files = Array.from(fileList || []).slice(0,2);
      const urls = [];
      for(const f of files){
        const url = await new Promise((resolve, reject)=>{
          const r = new FileReader();
          r.onload = ()=> resolve(String(r.result || ""));
          r.onerror = reject;
          r.readAsDataURL(f);
        });
        urls.push(url);
      }
      return urls;
    }

    // ===== Build custom question =====
    function buildQuestionFromForm(){
      const section = parseInt($('#qSection').value,10);
      const typeSel = $('#qType').value;
      const extras = getExtrasFromForm();

      const q = { id: state.editId || uid(), section, answerWrite: extras.answerWrite, facts: extras.facts };

      if(state.pendingImages.length){
        q.media = { type:"images", images: state.pendingImages.slice(0,2) };
      }

      if(typeSel==="prompt"){
        q.type="prompt";
        q.prompt = ($('#fPrompt').value||'').trim();
        q.answerType = ($('#fAnsType').value==="text") ? "text" : "num";
        q.correct = ($('#fCorrect').value||'').trim();
      }

      if(typeSel==="expr"){
        q.type="expr";
        q.op = $('#eOp').value;
        const right = parseNum($('#eRight').value);
        const left = parseNum($('#eLeft').value);
        q.right = Number.isFinite(right) ? right : 0;
        q.left  = Number.isFinite(left) ? left : 0;
        q.answerType = "num";

        const cRaw = ($('#eCorrect').value||'').trim();
        if(cRaw){
          const cMan = parseNum(cRaw);
          q.correct = Number.isFinite(cMan) ? cMan : "";
        }else{
          if(q.op==="+") q.correct = q.right + q.left;
          else if(q.op==="−") q.correct = q.right - q.left;
          else if(q.op==="×") q.correct = q.right * q.left;
          else if(q.op==="÷") q.correct = (q.left!==0 && q.right%q.left===0) ? (q.right/q.left) : "";
        }
        q.prompt = "احسب:";
      }

      if(typeSel==="fraction"){
        const numer = clamp(parseNum($('#frNum').value)||1, 1, 12);
        const denom = clamp(parseNum($('#frDen').value)||2, 2, 12);
        q.type="prompt";
        q.prompt = ($('#frPrompt').value||'اكتب الكسر الممثل بالشكل:').trim();
        q.answerType="frac";
        q.correct = `${numer}/${denom}`;
        q.media = { type:"svg", svg: svgFractionBar(numer, denom) };
      }

      if(typeSel==="shape2d"){
        const kind = $('#shKind').value;
        const ask = $('#shAsk').value;
        const prompt = ($('#shPrompt').value||'أجب عن السؤال:').trim();
        const map = {
          triangle:{name:"مثلث", sides:3},
          square:{name:"مربع", sides:4},
          rectangle:{name:"مستطيل", sides:4},
          pentagon:{name:"خماسي", sides:5},
          hexagon:{name:"سداسي", sides:6}
        }[kind];
        q.type="prompt";
        q.prompt = prompt + (ask==="name" ? " (اكتب الاسم)" : " (اكتب عدد الأضلاع)");
        q.answerType = (ask==="name") ? "text" : "num";
        q.correct = (ask==="name") ? map.name : map.sides;
        q.media = { type:"svg", svg: svgPolygon(kind) };
      }

      if(typeSel==="solid"){
        const kind = $('#soKind').value;
        const ask = $('#soAsk').value;
        const prompt = ($('#soPrompt').value||'أجب عن السؤال:').trim();
        const map = { cube:"مكعب", sphere:"كرة", cylinder:"أسطوانة", cone:"مخروط" };
        q.type="prompt";
        q.prompt = prompt + (ask==="name" ? " (اكتب الاسم)" : " (اكتب وصفًا قصيرًا)");
        q.answerType="text";
        q.correct = (ask==="name") ? map[kind] : "";
        q.media = { type:"svg", svg: svgSolid(kind) };
      }

      if(typeSel==="equation"){
        const tpl = $('#eqTpl').value;
        const a = parseNum($('#eqA').value)||2;
        const x = parseNum($('#eqX').value)||2;
        q.type="equation";
        q.eqText = ($('#eqPrompt').value||'أوجد قيمة س:').trim();
        if(tpl==="xplus"){
          q.correct = x;
          q.equation = `س + ${toArabicDigits(a)} = ${toArabicDigits(x+a)}`;
        }else if(tpl==="xminus"){
          q.correct = x;
          q.equation = `س − ${toArabicDigits(a)} = ${toArabicDigits(x-a)}`;
        }else if(tpl==="mul"){
          q.correct = x;
          q.equation = `${toArabicDigits(a)} × س = ${toArabicDigits(a*x)}`;
        }else{
          q.correct = a*x;
          q.equation = `س ÷ ${toArabicDigits(a)} = ${toArabicDigits(x)}`;
        }
      }

      if(typeSel==="functionTable"){
        const rt = $('#fnRuleType').value;
        const n = parseNum($('#fnN').value)||2;
        const inputsRaw = ($('#fnInputs').value||'1,2,3,4')
          .split(',').map(s=> parseNum(s)).filter(v=>Number.isFinite(v)).slice(0,6);
        const inputs = inputsRaw.length ? inputsRaw : [1,2,3,4];
        const outputs = inputs.map(x=> rt==="+" ? x+n : x*n);
        const mask = inputs.map((_,i)=> i%2===0);
        q.type="table";
        q.prompt = ($('#fnPrompt').value||'أكمل جدول الدالة:').trim();
        q.tableHtml = svgFunctionTable(rt==="+" ? `+ ${toArabicDigits(n)}` : `× ${toArabicDigits(n)}`, inputs, outputs, mask);
      }

      if(typeSel==="mcq"){
        q.type="mcq";
        q.prompt = ($('#mcqPrompt').value||'').trim();
        const lines = ($('#mcqOptions').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
        q.options = lines.length ? lines.slice(0,6) : ["خيار ١","خيار ٢","خيار ٣","خيار ٤"];
        const correct = parseInt($('#mcqCorrect').value||'1',10)-1;
        q.correctIndex = clamp(correct, 0, q.options.length-1);
      }

      return q;
    }

    function resetBuilder(){
      state.editId = null;
      $('#btnSaveQuestion').textContent = '➕ إضافة السؤال';
      $('#btnCancelEdit').style.display = 'none';
      $('#qSection').value = "2";
      $('#qType').value = "prompt";
      setTypeFields();
      setPendingImages([]);

      $('#xAnswerWrite').checked = false;
      $('#xAnswerWriteBox').style.display = "none";
      $('#xAnswerPrompt').value = "اكتب إجابتك:";
      $('#xAnswerLines').value = "2";
      $('#xAnswerRequired').checked = false;

      $('#xFacts').checked = false;
      $('#xFactsBox').style.display = "none";
      $('#xFactsPrompt').value = "اكتب الحقائق المترابطة:";
      $('#xFactsRequired').checked = false;
      $('#xFactsKey').value = "";
    }

    function renderQuestionList(){
      const list = $('#questionList');
      list.innerHTML = '';
      if(state.custom.questions.length===0){
        const d = document.createElement('div');
        d.style.fontWeight="1000";
        d.style.color="rgba(17,24,39,.65)";
        d.textContent = "لا يوجد أسئلة بعد.";
        list.appendChild(d);
        return;
      }

      state.custom.questions.forEach((q, idx)=>{
        const item = document.createElement('div');
        item.className = 'qItem';

        const meta = document.createElement('div');
        meta.className='qMeta';

        const extrasBadges = [];
        if(q.answerWrite?.enabled) extrasBadges.push('إجابة مكتوبة');
        if(q.facts?.enabled) extrasBadges.push('حقائق');

        const kind = q.type === "expr" ? "تعبير" :
                     q.type === "equation" ? "معادلة" :
                     q.type === "table" ? "جدول" :
                     q.type === "mcq" ? "اختيار" : "سؤال";

        const summary = q.type==="expr"
          ? `${toArabicDigits(q.right)} ${q.op} ${toArabicDigits(q.left)}`
          : (q.type==="equation" ? (q.equation||"") : (q.prompt||"").slice(0,60));

        meta.innerHTML = `
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <span class="pill">س${toArabicDigits(idx+1)}</span>
            <span class="pill">قسم ${toArabicDigits(q.section)}</span>
            <span class="pill">${kind}</span>
            ${extrasBadges.map(x=>`<span class="pill">${x}</span>`).join('')}
          </div>
          <div style="margin-top:6px;">${toArabicDigits(summary)}</div>
        `;

        if(q.media?.type==="images" && q.media.images?.length){
          const thumbs = document.createElement('div');
          thumbs.className='thumbs';
          q.media.images.slice(0,2).forEach(src=>{
            const img=document.createElement('img');
            img.className='thumb'; img.src=src; img.alt='صورة';
            thumbs.appendChild(img);
          });
          meta.appendChild(thumbs);
        }

        const actions = document.createElement('div');
        actions.className='qActions';

        const up = document.createElement('button');
        up.className='btn ghost'; up.textContent='⬆️'; up.type='button';
        up.disabled = idx===0;
        up.addEventListener('click', ()=>{
          const arr = state.custom.questions;
          [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
          saveCustomLocal();
          renderQuestionList();
          renderCustomPreview();
        });

        const down = document.createElement('button');
        down.className='btn ghost'; down.textContent='⬇️'; down.type='button';
        down.disabled = idx===state.custom.questions.length-1;
        down.addEventListener('click', ()=>{
          const arr = state.custom.questions;
          [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
          saveCustomLocal();
          renderQuestionList();
          renderCustomPreview();
        });

        const edit = document.createElement('button');
        edit.className='btn'; edit.textContent='✏️ تعديل'; edit.type='button';
        edit.addEventListener('click', ()=> startEdit(q.id));

        const del = document.createElement('button');
        del.className='btn danger'; del.textContent='🗑️ حذف'; del.type='button';
        del.addEventListener('click', ()=>{
          state.custom.questions = state.custom.questions.filter(x=>x.id!==q.id);
          saveCustomLocal();
          renderQuestionList();
          renderCustomPreview();
          if(state.editId===q.id) resetBuilder();
          showToast("تم حذف السؤال", "ok");
        });

        actions.appendChild(up);
        actions.appendChild(down);
        actions.appendChild(edit);
        actions.appendChild(del);

        item.appendChild(meta);
        item.appendChild(actions);
        list.appendChild(item);
      });
    }

    function startEdit(id){
      const q = state.custom.questions.find(x=>x.id===id);
      if(!q) return;

      state.editId = id;
      $('#btnSaveQuestion').textContent = '💾 حفظ';
      $('#btnCancelEdit').style.display = 'inline-flex';

      $('#qSection').value = String(q.section);

      // map to builder type
      if(q.type==="prompt") $('#qType').value = "prompt";
      else if(q.type==="expr") $('#qType').value = "expr";
      else if(q.type==="equation") $('#qType').value = "equation";
      else if(q.type==="table") $('#qType').value = "functionTable";
      else if(q.type==="mcq") $('#qType').value = "mcq";
      else $('#qType').value = "prompt";

      setTypeFields();

      // images
      if(q.media?.type==="images") setPendingImages(q.media.images||[]);
      else setPendingImages([]);

      // extras
      $('#xAnswerWrite').checked = !!q.answerWrite?.enabled;
      $('#xAnswerWriteBox').style.display = $('#xAnswerWrite').checked ? "block":"none";
      $('#xAnswerPrompt').value = q.answerWrite?.prompt || "اكتب إجابتك:";
      $('#xAnswerLines').value = String(q.answerWrite?.lines || 2);
      $('#xAnswerRequired').checked = !!q.answerWrite?.required;

      $('#xFacts').checked = !!q.facts?.enabled;
      $('#xFactsBox').style.display = $('#xFacts').checked ? "block":"none";
      $('#xFactsPrompt').value = q.facts?.prompt || "اكتب الحقائق المترابطة:";
      $('#xFactsRequired').checked = !!q.facts?.required;
      $('#xFactsKey').value = q.facts?.key || "";

      setTimeout(()=>{
        if(q.type==="prompt"){
          $('#fPrompt').value = q.prompt || "";
          $('#fAnsType').value = (q.answerType==="text") ? "text" : "num";
          $('#fCorrect').value = q.correct ? String(q.correct) : "";
        }
        if(q.type==="expr"){
          $('#eOp').value = q.op || "÷";
          $('#eRight').value = toArabicDigits(q.right ?? "");
          $('#eLeft').value  = toArabicDigits(q.left ?? "");
          $('#eCorrect').value = (q.correct!=="" && q.correct!==null && q.correct!==undefined) ? toArabicDigits(q.correct) : "";
        }
        if(q.type==="mcq"){
          $('#mcqPrompt').value = q.prompt || "";
          $('#mcqOptions').value = (q.options||[]).join("\n");
          $('#mcqCorrect').value = String((q.correctIndex||0)+1);
        }
      },0);

      window.scrollTo({top:0, behavior:'smooth'});
    }

    // ===== Export/Import =====
    function downloadJSON(obj, filename="worksheet.json"){
      const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    $('#btnExport').addEventListener('click', ()=>{
      syncCustomHeader();
      downloadJSON(state.custom, "worksheet_custom.json");
      showToast("تم تصدير الملف", "ok");
    });

    $('#importFile').addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        const txt = await file.text();
        const obj = JSON.parse(txt);
        if(!obj || !Array.isArray(obj.questions)) throw new Error("bad");
        state.custom = obj;

        $('#customTitle').value = state.custom.title || "ورقة عمل رياضيات";
        $('#customGrade').value = state.custom.grade || "ثالث";
        $('#customSec1Text').value = state.custom.sec1Text || "القسم (١)";
        $('#customSec2Text').value = state.custom.sec2Text || "القسم (٢)";

        saveCustomLocal();
        renderQuestionList();
        renderCustomPreview();
        resetBuilder();
        showToast("تم استيراد الملف", "ok");
      }catch(err){
        showToast("تعذر استيراد الملف", "bad");
      }finally{
        e.target.value = "";
      }
    });

    // ===== Wire UI =====
    $('#btnAutoGenerate').addEventListener('click', generateAuto);

    $('#qType').addEventListener('change', setTypeFields);

    $('#qImages').addEventListener('change', async (e)=>{
      const urls = await readFilesToDataUrls(e.target.files);
      setPendingImages(urls);
      e.target.value = "";
    });

    $('#btnClearImages').addEventListener('click', ()=> setPendingImages([]));

    $('#xAnswerWrite').addEventListener('change', ()=> $('#xAnswerWriteBox').style.display = $('#xAnswerWrite').checked ? "block":"none");
    $('#xFacts').addEventListener('change', ()=> $('#xFactsBox').style.display = $('#xFacts').checked ? "block":"none");

    $('#btnCancelEdit').addEventListener('click', resetBuilder);

    $('#btnSaveQuestion').addEventListener('click', ()=>{
      syncCustomHeader();
      const q = buildQuestionFromForm();

      const idx = state.custom.questions.findIndex(x=>x.id===q.id);
      if(idx>=0) state.custom.questions[idx] = q;
      else state.custom.questions.push(q);

      saveCustomLocal();
      renderQuestionList();
      renderCustomPreview();
      resetBuilder();
      showToast("تم حفظ السؤال", "ok");
    });

    ['customTitle','customGrade','customSec1Text','customSec2Text'].forEach(id=>{
      const el=document.getElementById(id);
      el.addEventListener('input', ()=>{
        syncCustomHeader();
        renderCustomPreview();
      });
      el.addEventListener('change', ()=>{
        syncCustomHeader();
        renderCustomPreview();
      });
    });

    function setMode(mode){
      state.mode = mode;
      $('#tabAuto').classList.toggle('active', mode==="auto");
      $('#tabCustom').classList.toggle('active', mode==="custom");
      $('#autoPanel').style.display = (mode==="auto") ? "block" : "none";
      $('#customPanel').style.display = (mode==="custom") ? "block" : "none";

      if(mode==="auto"){
        generateAuto();
      }else{
        syncCustomHeader();
        renderQuestionList();
        renderCustomPreview();
      }
    }

    $('#tabAuto').addEventListener('click', ()=> setMode("auto"));
    $('#tabCustom').addEventListener('click', ()=> setMode("custom"));

    // ===== Check/Clear/Print =====
    function checkAll(){
      let total=0, ok=0;

      // answers
      $$('.ans').forEach(inp=>{
        const at = inp.dataset.atype || "num";
        const correct = inp.dataset.correct || "";
        inp.classList.remove('correct','wrong');
        if(!correct) return;

        total++;
        if(at==="num"){
          const v = parseNum(inp.value);
          const c = parseInt(correct,10);
          if(Number.isFinite(v) && v===c){ ok++; inp.classList.add('correct'); }
          else inp.classList.add('wrong');
        }else if(at==="frac"){
          const v = normalizeFrac(inp.value);
          if(v && v===correct){ ok++; inp.classList.add('correct'); }
          else inp.classList.add('wrong');
        }else{
          const v = normalizeText(inp.value);
          if(v && v===correct){ ok++; inp.classList.add('correct'); }
          else inp.classList.add('wrong');
        }
      });

      // required written answers
      $$('.noteInput').forEach(el=>{
        const req = (el.dataset.required==="1");
        el.classList.remove('ok','bad');
        if(!req) return;
        total++;
        if(el.value.trim()){ ok++; el.classList.add('ok'); }
        else el.classList.add('bad');
      });

      // related facts
      $$('.factsInput').forEach(el=>{
        const req = (el.dataset.required==="1");
        const key = (el.dataset.key||"").trim();
        el.classList.remove('ok','bad');

        const v = el.value.trim();
        if(!req && !v) return;

        total++;
        if(req && !v){ el.classList.add('bad'); return; }

        if(key){
          const accepted = key.split('|').map(s=> normalizeFact(s)).filter(Boolean);
          const vv = normalizeFact(v);
          if(vv && accepted.includes(vv)){ ok++; el.classList.add('ok'); }
          else el.classList.add('bad');
        }else{
          if(v){ ok++; el.classList.add('ok'); }
          else el.classList.add('bad');
        }
      });

      if(total===0) showToast("لا يوجد مفاتيح للتحقق", "bad");
      else showToast(`تم التحقق: ${ok} من ${total}`, ok===total ? "ok" : "");
    }

    function clearAll(){
      $$('.ans').forEach(inp=>{ inp.value=''; inp.classList.remove('correct','wrong'); });
      $$('.noteInput').forEach(t=>{ t.value=''; t.classList.remove('ok','bad'); });
      $$('.factsInput').forEach(t=>{ t.value=''; t.classList.remove('ok','bad'); });
      $$('.mcqCircle').forEach(c=> c.classList.remove('fill'));
      showToast("تم المسح", "ok");
    }

    $('#btnCheck').addEventListener('click', checkAll);
    $('#btnClear').addEventListener('click', clearAll);
    $('#btnPrint').addEventListener('click', ()=> window.print());

    // ===== Init =====
    loadCustomLocal();

    $('#customTitle').value = state.custom.title || "ورقة عمل رياضيات";
    $('#customGrade').value = state.custom.grade || "ثالث";
    $('#customSec1Text').value = state.custom.sec1Text || "أجب عن الأسئلة التالية:";
    $('#customSec2Text').value = state.custom.sec2Text || "تدريب إضافي:";

    setTypeFields();
    renderQuestionList();

    // Default: auto mode
    setMode("auto");
  </script>
</body>
</html>
